services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: lavilla_postgres
    environment:
      POSTGRES_USER: lavilla
      POSTGRES_PASSWORD: lavilla
      POSTGRES_DB: lavilla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavilla -d lavilla"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [lavilla]

  redis:
    image: redis:7-alpine
    container_name: lavilla_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [lavilla]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lavilla_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lavilla
      RABBITMQ_DEFAULT_PASS: lavilla
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [lavilla]

  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: lavilla_meilisearch
    environment:
      MEILI_MASTER_KEY: lavilla-master-key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [lavilla]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lavilla_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lavilla
      MINIO_ROOT_PASSWORD: lavilla123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [lavilla]

  # ============================================================
  # APPLICATION — GATEWAY
  # ============================================================
  gateway:
    build:
      context: ./app/backend/gateway
      dockerfile: Dockerfile
    container_name: lavilla_gateway
    ports:
      - "8010:8010"
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:OeaGmut17Oy48ePZ6iU7XXlEAwi/4BkBlDCJYu77ZKk=
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: lavilla
      DB_USERNAME: lavilla
      DB_PASSWORD: lavilla
      REDIS_HOST: redis
      SERVICE_CATALOG_URL: http://catalog:9002
      SERVICE_INVENTORY_URL: http://inventory:9003
      SERVICE_CART_URL: http://orders:9004
      SERVICE_USERS_URL: http://users:9007
      SERVICE_PAYMENTS_URL: http://payments:9005
      SERVICE_NOTIFICATIONS_URL: http://notifications:9006
      SERVICE_DRIVE_SYNC_URL: ""
      SERVICE_IMAGE_PROCESSOR_URL: ""
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lavillasb.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-VillaAdmin2026!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [lavilla]

  # ============================================================
  # APPLICATION — MICROSERVICES
  # ============================================================
  catalog:
    build:
      context: ./app/microservices/catalog
      dockerfile: Dockerfile
    container_name: lavilla_catalog
    ports:
      - "9002:9002"
    environment:
      DATABASE_URL: postgresql+asyncpg://lavilla:lavilla@postgres:5432/lavilla
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: lavilla
      S3_SECRET_ACCESS_KEY: lavilla123
      S3_BUCKET: catalog-media
      S3_REGION: us-east-1
      CDN_BASE_URL: http://localhost:9000/catalog-media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../reference/database/drive/Catálogo La Villa:/data/catalog:ro
    networks: [lavilla]

  inventory:
    build:
      context: ./app/microservices/inventory
      dockerfile: Dockerfile
    container_name: lavilla_inventory
    ports:
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [lavilla]

  orders:
    build:
      context: ./app/microservices/orders
      dockerfile: Dockerfile
    container_name: lavilla_orders
    ports:
      - "9004:9004"
    environment:
      NOTIFICATIONS_URL: http://notifications:9006
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [lavilla]

  notifications:
    build:
      context: ./app/microservices/notifications
      dockerfile: Dockerfile
    container_name: lavilla_notifications
    ports:
      - "9006:9006"
    environment:
      CATALOG_SERVICE_URL: http://catalog:9002
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-whatsapp:+14155238886}
      TWILIO_TO: ${TWILIO_TO:-+573245710972}
    depends_on:
      catalog:
        condition: service_started
    restart: unless-stopped
    networks: [lavilla]

  payments:
    build:
      context: ./app/microservices/payments
      dockerfile: Dockerfile
    container_name: lavilla_payments
    ports:
      - "9005:9005"
    environment:
      DATABASE_URL: postgresql+asyncpg://lavilla:lavilla@postgres:5432/lavilla
      REDIS_URL: redis://redis:6379/4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [lavilla]

  users:
    build:
      context: ./app/microservices/users
      dockerfile: Dockerfile
    container_name: lavilla_users
    ports:
      - "9007:9007"
    environment:
      DATABASE_URL: postgresql+asyncpg://lavilla:lavilla@postgres:5432/lavilla
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [lavilla]

  # ============================================================
  # APPLICATION — FRONTEND
  # ============================================================
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: lavilla_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://gateway:8010
      MEDIA_ORIGIN_BASE_URL: http://minio:9000
      NEXT_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/la_villa_sb/
      NEXT_PUBLIC_WHATSAPP_URL: https://api.whatsapp.com/send/?phone=573245710972&app_absent=0&utm_source=ig
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks: [lavilla]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  meilisearch_data:
  minio_data:

networks:
  lavilla:
    driver: bridge
